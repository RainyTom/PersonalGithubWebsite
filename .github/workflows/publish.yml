name: Hourly Wiki and Pages

on:
  push:
    branches: [main]
  schedule:
    # GitHub cron 使用 UTC；每小时检查，内容日期单独按 Asia/Shanghai 判断。
    - cron: '0 * * * *'
  workflow_dispatch:

permissions:
  contents: read

# push / schedule / 手动运行共用锁，避免同时生成同一天的文章。
concurrency:
  group: blog-publish
  cancel-in-progress: false

jobs:
  build:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: write
      pages: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: main
          fetch-depth: 0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      - name: Verify generation logic
        run: npm test
      - name: Generate today's article if missing
        run: npm run generate
        env:
          CONTENT_TIMEZONE: Asia/Shanghai
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          OPENAI_MODEL: ${{ vars.OPENAI_MODEL }}
          OPENAI_BASE_URL: ${{ vars.OPENAI_BASE_URL || 'https://api.openai.com/v1' }}
      - name: Rebuild folder-based navigation
        run: npm run sidebar
      - run: npm run check
      - name: Configure Pages
        uses: actions/configure-pages@45bfe0192ca1faeb007ade9deae92b16b8254a0d # v6.0.0
      # 构建先通过，再提交内容，避免把无法构建的文章自动推上 main。
      - run: npm run build
      - name: Commit changed knowledge and navigation
        run: |
          git add docs/wiki/ docs/.vitepress/generated/
          if git diff --cached --quiet; then
            echo "No content changes; no empty commit."
          else
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git commit -m "content: update daily knowledge and navigation"
            # 远端变化时让任务失败，由下一次定时任务重试；不强推、不覆盖人工内容。
            git push origin HEAD:main
          fi
          # 构建期间有人推送时，不发布过时版本。
          remote_head=$(git ls-remote origin refs/heads/main | cut -f1)
          test "$remote_head" = "$(git rev-parse HEAD)"
      - uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: docs/.vitepress/dist

  deploy:
    needs: build
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1
